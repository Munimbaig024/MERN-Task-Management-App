# render.yaml — Deployment configuration for Render.com
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API (Node/Express) ──────────────────────────────────────────────
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # Set manually in Render dashboard (secret)
      - key: JWT_SECRET
        sync: false          # Set manually in Render dashboard (secret)
      - key: CLIENT_ORIGIN
        sync: false          # Set to your deployed frontend URL

  # ── Frontend (React/Vite static site) ──────────────────────────────────────
  - type: web
    name: taskflow-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html    # SPA fallback for React Router
